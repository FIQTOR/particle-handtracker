<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Controlled 3D Particles</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Inter', sans-serif; }
        canvas { display: block; }
        
        /* Custom Scrollbar for the panel */
        .glass-panel {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .video-feed {
            transform: scaleX(-1); /* Mirror the webcam */
            object-fit: cover;
            opacity: 0.8;
            border-radius: 12px;
        }

        .loader {
            border-top-color: #3498db;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }

        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Color Picker Reset */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            padding: 0;
            background: none;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <!-- Main Canvas Container -->
    <div id="canvas-container" class="w-full h-full absolute top-0 left-0 z-0"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black transition-opacity duration-500">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-700 h-12 w-12 mb-4"></div>
        <h2 class="text-white text-xl font-light tracking-widest">INITIALIZING VISION AI...</h2>
        <p class="text-gray-500 text-sm mt-2">Please allow camera access</p>
    </div>

    <!-- UI Controls -->
    <div class="absolute top-4 right-4 z-40 w-72 glass-panel rounded-2xl p-5 text-white transition-all duration-300 transform translate-x-0" id="controls-panel">
        
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-lg font-semibold tracking-wide">Particle Control</h1>
            <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse" id="status-indicator" title="Vision AI Status"></div>
        </div>

        <!-- Camera Feed -->
        <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden mb-6 border border-white/10 shadow-inner group">
            <video id="webcam" class="video-feed w-full h-full" autoplay playsinline muted></video>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div id="gesture-hint" class="text-xs bg-black/60 px-2 py-1 rounded text-white/80 backdrop-blur-sm">
                    Detecting Hands...
                </div>
            </div>
        </div>

        <!-- Shape Selection -->
        <div class="mb-6">
            <label class="text-xs uppercase text-gray-400 font-bold tracking-wider mb-3 block">Model Shape</label>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="setShape('heart')" class="shape-btn p-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/5 text-xs transition-colors focus:ring-2 ring-blue-500 focus:outline-none">Heart</button>
                <button onclick="setShape('saturn')" class="shape-btn p-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/5 text-xs transition-colors focus:ring-2 ring-blue-500 focus:outline-none">Saturn</button>
                <button onclick="setShape('flower')" class="shape-btn p-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/5 text-xs transition-colors focus:ring-2 ring-blue-500 focus:outline-none">Flower</button>
                <button onclick="setShape('buddha')" class="shape-btn p-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/5 text-xs transition-colors focus:ring-2 ring-blue-500 focus:outline-none">Statue</button>
                <button onclick="setShape('fireworks')" class="shape-btn p-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/5 text-xs transition-colors focus:ring-2 ring-blue-500 focus:outline-none">Bang</button>
                <button onclick="setShape('sphere')" class="shape-btn p-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/5 text-xs transition-colors focus:ring-2 ring-blue-500 focus:outline-none">Sphere</button>
            </div>
        </div>

        <!-- Appearance -->
        <div class="mb-6">
            <label class="text-xs uppercase text-gray-400 font-bold tracking-wider mb-3 block">Appearance</label>
            <div class="flex items-center justify-between bg-white/5 p-3 rounded-xl border border-white/5">
                <span class="text-sm text-gray-300">Particle Color</span>
                <input type="color" id="color-picker" value="#00ffff">
            </div>
        </div>

        <!-- Manual Fallback -->
        <div>
            <label class="text-xs uppercase text-gray-400 font-bold tracking-wider mb-2 block flex justify-between">
                <span>Expansion</span>
                <span id="expansion-val" class="text-blue-400">0%</span>
            </label>
            <input type="range" id="manual-slider" min="0" max="1" step="0.01" value="0" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
            <p class="text-[10px] text-gray-500 mt-2 text-center">Open Hand to Expand • Close Fist to Contract</p>
        </div>

    </div>

    <!-- Modules for MediaPipe and Main Logic -->
    <script type="module">
        import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

        // --- Configuration ---
        const PARTICLE_COUNT = 25000;
        const PARTICLE_SIZE = 0.08;
        let expansionFactor = 0; // 0 = Shape, 1 = Diffused
        let targetColor = new THREE.Color(0x00ffff);
        
        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 6;
        camera.position.y = 1;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- Helper: Safe Random Direction ---
        // Polyfill-like behavior for environments where .randomDirection() is missing
        function setRandomDirection(vec) {
            const u = Math.random();
            const v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            // setFromSphericalCoords(radius, phi, theta)
            // Note: Three.js Spherical coords: phi is polar angle from +y, theta is equator angle around y
            vec.setFromSphericalCoords(1, phi, theta);
            return vec;
        }

        // --- Particle System ---
        // We use BufferGeometry with custom attributes
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3); // Where particles want to go
        const randomness = new Float32Array(PARTICLE_COUNT * 3); // Random noise for diffusion

        // Initialize with Sphere shape
        const sphereVec = new THREE.Vector3();
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            // Initial random sphere
            setRandomDirection(sphereVec).multiplyScalar(Math.random() * 2 + 0.5);
            positions[i * 3] = sphereVec.x;
            positions[i * 3 + 1] = sphereVec.y;
            positions[i * 3 + 2] = sphereVec.z;

            // Random diffusion vectors
            const r = new THREE.Vector3();
            setRandomDirection(r);
            randomness[i * 3] = r.x * 6; // Spread width
            randomness[i * 3 + 1] = r.y * 6;
            randomness[i * 3 + 2] = r.z * 6;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('target', new THREE.BufferAttribute(targetPositions, 3));
        geometry.setAttribute('aRandom', new THREE.BufferAttribute(randomness, 3));

        // Custom Shader Material
        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uColor: { value: targetColor },
                uExpansion: { value: 0.0 }, // Controlled by hand/slider
                uSize: { value: PARTICLE_SIZE * window.innerHeight * 0.5 } // Responsive size
            },
            vertexShader: `
                uniform float uTime;
                uniform float uExpansion;
                uniform float uSize;
                
                attribute vec3 target;
                attribute vec3 aRandom;
                
                varying float vAlpha;

                // Simplex noise function
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
                vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
                float snoise(vec3 v) { 
                    const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                    const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                    vec3 i  = floor(v + dot(v, C.yyy) );
                    vec3 x0 = v - i + dot(i, C.xxx) ;
                    vec3 g = step(x0.yzx, x0.xyz);
                    vec3 l = 1.0 - g;
                    vec3 i1 = min( g.xyz, l.zxy );
                    vec3 i2 = max( g.xyz, l.zxy );
                    vec3 x1 = x0 - i1 + C.xxx;
                    vec3 x2 = x0 - i2 + C.yyy;
                    vec3 x3 = x0 - D.yyy;
                    i = mod289(i); 
                    vec4 p = permute( permute( permute( 
                                i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                            + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                            + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                    float n_ = 0.142857142857; 
                    vec3  ns = n_ * D.wyz - D.xzx;
                    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                    vec4 x_ = floor(j * ns.z);
                    vec4 y_ = floor(j - 7.0 * x_ );
                    vec4 x = x_ *ns.x + ns.yyyy;
                    vec4 y = y_ *ns.x + ns.yyyy;
                    vec4 h = 1.0 - abs(x) - abs(y);
                    vec4 b0 = vec4( x.xy, y.xy );
                    vec4 b1 = vec4( x.zw, y.zw );
                    vec4 s0 = floor(b0)*2.0 + 1.0;
                    vec4 s1 = floor(b1)*2.0 + 1.0;
                    vec4 sh = -step(h, vec4(0.0));
                    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                    vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                    vec3 p0 = vec3(a0.xy,h.x);
                    vec3 p1 = vec3(a0.zw,h.y);
                    vec3 p2 = vec3(a1.xy,h.z);
                    vec3 p3 = vec3(a1.zw,h.w);
                    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                    p0 *= norm.x;
                    p1 *= norm.y;
                    p2 *= norm.z;
                    p3 *= norm.w;
                    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                    m = m * m;
                    return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
                }

                void main() {
                    // Mix between target shape and chaotic noise based on expansion
                    // We also add a subtle wave motion to the target state
                    
                    float noise = snoise(target + uTime * 0.2);
                    vec3 wavePos = target + normalize(target) * noise * 0.1;

                    // Calculate Diffused Position
                    vec3 diffusedPos = wavePos + aRandom * uExpansion * 2.0;
                    
                    // Final mix
                    // If uExpansion is 0, we are at shape. If 1, we are scattered.
                    vec3 finalPos = mix(wavePos, diffusedPos, uExpansion);

                    // Add rotation based on expansion (explosion effect)
                    if(uExpansion > 0.1) {
                       // simple twist could go here
                    }

                    vec4 mvPosition = modelViewMatrix * vec4(finalPos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    
                    // Size attenuation
                    gl_PointSize = uSize * (1.0 / -mvPosition.z);
                    
                    // Fade out alpha slightly when expanded
                    vAlpha = 1.0 - (uExpansion * 0.6);
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                varying float vAlpha;

                void main() {
                    // Circular particle
                    vec2 uv = gl_PointCoord.xy - 0.5;
                    float r = length(uv);
                    if (r > 0.5) discard;

                    // Glow effect
                    float glow = 1.0 - (r * 2.0);
                    glow = pow(glow, 1.5);

                    gl_FragColor = vec4(uColor, vAlpha * glow);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- Shape Generators ---
        const shapes = {
            sphere: () => {
                const arr = new Float32Array(PARTICLE_COUNT * 3);
                const vec = new THREE.Vector3();
                for(let i=0; i<PARTICLE_COUNT; i++){
                    const u = Math.random();
                    const v = Math.random();
                    const theta = 2 * Math.PI * u;
                    const phi = Math.acos(2 * v - 1);
                    const r = 2.5; // Radius
                    vec.setFromSphericalCoords(r, phi, theta);
                    arr[i*3] = vec.x; arr[i*3+1] = vec.y; arr[i*3+2] = vec.z;
                }
                return arr;
            },
            heart: () => {
                const arr = new Float32Array(PARTICLE_COUNT * 3);
                for(let i=0; i<PARTICLE_COUNT; i++){
                    // Heart parametric
                    // x = 16sin^3(t)
                    // y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
                    // Extend to 3D by rotating or layering
                    
                    // Let's use a 3D volume heart
                    const phi = Math.random() * Math.PI * 2;
                    const theta = Math.random() * Math.PI;
                    // Approximate spread
                    const x = 16 * Math.pow(Math.sin(theta), 3) * Math.sin(phi);
                    const y = 13 * Math.cos(theta) - 5 * Math.cos(2*theta) - 2 * Math.cos(3*theta) - Math.cos(4*theta);
                    const z = 16 * Math.pow(Math.sin(theta), 3) * Math.cos(phi);
                    
                    // Scale down
                    const scale = 0.15;
                    arr[i*3] = x * scale; 
                    arr[i*3+1] = y * scale; 
                    arr[i*3+2] = z * scale;
                }
                return arr;
            },
            saturn: () => {
                const arr = new Float32Array(PARTICLE_COUNT * 3);
                const vec = new THREE.Vector3();
                for(let i=0; i<PARTICLE_COUNT; i++){
                    if(i < PARTICLE_COUNT * 0.4) {
                        // Planet Body
                        setRandomDirection(vec).multiplyScalar(1.5);
                        arr[i*3] = vec.x; arr[i*3+1] = vec.y; arr[i*3+2] = vec.z;
                    } else {
                        // Rings
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 2.2 + Math.random() * 2.5;
                        arr[i*3] = Math.cos(angle) * dist;
                        arr[i*3+1] = (Math.random() - 0.5) * 0.1; // Flat y
                        arr[i*3+2] = Math.sin(angle) * dist;
                        
                        // Tilt ring
                        const x = arr[i*3];
                        const y = arr[i*3+1];
                        const tilt = 0.4;
                        arr[i*3] = x * Math.cos(tilt) - y * Math.sin(tilt);
                        arr[i*3+1] = x * Math.sin(tilt) + y * Math.cos(tilt);
                    }
                }
                return arr;
            },
            flower: () => {
                const arr = new Float32Array(PARTICLE_COUNT * 3);
                for(let i=0; i<PARTICLE_COUNT; i++){
                    const u = Math.random() * Math.PI * 2; // Angle
                    const v = Math.random() * Math.PI; // Elevation
                    // Rose curve r = cos(k*theta)
                    const k = 4;
                    const r = 2.5 * Math.abs(Math.cos(k * u) * Math.sin(v));
                    
                    arr[i*3] = r * Math.cos(u) * Math.sin(v);
                    arr[i*3+1] = r * Math.cos(v);
                    arr[i*3+2] = r * Math.sin(u) * Math.sin(v);
                }
                return arr;
            },
            fireworks: () => {
                const arr = new Float32Array(PARTICLE_COUNT * 3);
                const vec = new THREE.Vector3();
                for(let i=0; i<PARTICLE_COUNT; i++){
                    // Explosion trails
                    const u = Math.random();
                    const v = Math.random();
                    // Dense center, wispy trails
                    const radius = Math.pow(u, 0.5) * 4.0; 
                    setRandomDirection(vec).multiplyScalar(radius);
                    arr[i*3] = vec.x; arr[i*3+1] = vec.y; arr[i*3+2] = vec.z;
                }
                return arr;
            },
            buddha: () => {
                 // Simplified "Meditating Figure" using primitives
                 const arr = new Float32Array(PARTICLE_COUNT * 3);
                 const vec = new THREE.Vector3();
                 for(let i=0; i<PARTICLE_COUNT; i++){
                     const r = Math.random();
                     if(r < 0.2) {
                         // Head
                         setRandomDirection(vec).multiplyScalar(0.6);
                         vec.y += 1.5;
                     } else if (r < 0.6) {
                         // Body (Cone-ish)
                         const h = (Math.random() - 0.5) * 2; // -1 to 1
                         const rad = (1.0 - (h + 1)/2.5) * 1.2;
                         const ang = Math.random() * Math.PI * 2;
                         vec.set(Math.cos(ang)*rad, h, Math.sin(ang)*rad);
                     } else {
                         // Legs/Base (Flattened sphere)
                         const ang = Math.random() * Math.PI * 2;
                         const rad = 1.5 + Math.random();
                         vec.set(Math.cos(ang)*rad, -1.2 + Math.random()*0.5, Math.sin(ang)*rad);
                     }
                     arr[i*3] = vec.x; arr[i*3+1] = vec.y; arr[i*3+2] = vec.z;
                 }
                 return arr;
            }
        };

        // Function to smoothly transition shapes
        window.setShape = (shapeName) => {
            const newPos = shapes[shapeName]();
            // In a real app we might tween this array, but here we swap the buffer
            // and let the material's 'uExpansion' handle the visual transition style
            // Actually, simply swapping buffers causes a jump.
            // Let's implement a CPU tween for position attributes or just snap for now to keep it performant
            // Better: update the 'target' attribute.
            
            // GSAP-like animation for the buffer
            const currentAttr = geometry.attributes.target;
            const targetArray = newPos;
            
            // Simple interpolation loop
            let progress = 0;
            const startArray = new Float32Array(currentAttr.array);
            
            const animateShape = () => {
                progress += 0.02;
                if(progress >= 1) progress = 1;
                
                for(let i=0; i<PARTICLE_COUNT*3; i++){
                    currentAttr.array[i] = startArray[i] + (targetArray[i] - startArray[i]) * progress;
                }
                currentAttr.needsUpdate = true;
                
                if(progress < 1) requestAnimationFrame(animateShape);
            };
            animateShape();
        };
        
        // Init default shape
        const initShape = shapes.sphere();
        geometry.attributes.target.set(initShape);


        // --- Interaction Logic (Color & Slider) ---
        const colorPicker = document.getElementById('color-picker');
        colorPicker.addEventListener('input', (e) => {
            targetColor.set(e.target.value);
            material.uniforms.uColor.value = targetColor;
        });

        const manualSlider = document.getElementById('manual-slider');
        const expansionVal = document.getElementById('expansion-val');
        
        let isHandDetected = false;

        manualSlider.addEventListener('input', (e) => {
            if(!isHandDetected) {
                expansionFactor = parseFloat(e.target.value);
                expansionVal.innerText = Math.round(expansionFactor * 100) + "%";
            }
        });

        // --- Computer Vision (MediaPipe) ---
        let handLandmarker = undefined;
        let webcamRunning = false;
        const video = document.getElementById("webcam");
        const statusInd = document.getElementById("status-indicator");
        const gestureHint = document.getElementById("gesture-hint");
        const loadingOverlay = document.getElementById("loading-overlay");

        const createHandLandmarker = async () => {
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
                );
                
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 1
                });
                
                startWebcam();
            } catch (err) {
                console.error(err);
                alert("Failed to load vision model. Please ensure WebGL is enabled.");
                loadingOverlay.style.display = 'none';
            }
        };

        const startWebcam = () => {
            if (!handLandmarker) return;

            const constraints = { video: true };
            navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", () => {
                    webcamRunning = true;
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => loadingOverlay.style.display = 'none', 500);
                    statusInd.classList.remove('bg-red-500');
                    statusInd.classList.add('bg-green-500');
                    statusInd.classList.remove('animate-pulse');
                    predictWebcam();
                });
            }).catch(err => {
                console.error("Camera denied:", err);
                loadingOverlay.innerHTML = "<h2 class='text-white'>Camera Access Denied</h2><p class='text-gray-400'>Use the slider manually.</p>";
                setTimeout(() => loadingOverlay.style.display = 'none', 2000);
            });
        };

        let lastVideoTime = -1;
        
        const predictWebcam = async () => {
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                const startTimeMs = performance.now();
                
                if (handLandmarker) {
                    const result = handLandmarker.detectForVideo(video, startTimeMs);
                    
                    if (result.landmarks && result.landmarks.length > 0) {
                        isHandDetected = true;
                        const landmarks = result.landmarks[0];
                        
                        // Calculate "Openness" of hand
                        // Distance between Wrist(0) and Middle Finger Tip(12)
                        // Normalized by Wrist(0) to Index MCP(5) (Palm size proxy)
                        
                        const wrist = landmarks[0];
                        const middleTip = landmarks[12];
                        const indexMCP = landmarks[5];
                        
                        const palmSize = Math.sqrt(
                            Math.pow(wrist.x - indexMCP.x, 2) + 
                            Math.pow(wrist.y - indexMCP.y, 2)
                        );
                        
                        const handSpan = Math.sqrt(
                            Math.pow(wrist.x - middleTip.x, 2) + 
                            Math.pow(wrist.y - middleTip.y, 2)
                        );
                        
                        // Ratio: Closed fist ~ 0.8-1.0 palmSize, Open hand ~ 2.0+ palmSize
                        const ratio = handSpan / palmSize;
                        
                        // Map ratio to 0-1 (Closed -> Open)
                        // Typical values: Fist ~1.0, Open ~2.5
                        let openness = (ratio - 1.0) / 1.5; 
                        openness = Math.max(0, Math.min(1, openness));
                        
                        // Logic: Open Hand = Explosion (1), Closed Fist = Shape (0)
                        // Use Linear Interpolation for smoothness
                        expansionFactor = expansionFactor + (openness - expansionFactor) * 0.1;

                        gestureHint.innerText = openness > 0.5 ? "Status: Expanding" : "Status: Contracting";
                        
                        // Sync slider visually
                        manualSlider.value = expansionFactor;
                        expansionVal.innerText = Math.round(expansionFactor * 100) + "%";

                        // Optional: Rotate model with hand X position
                        // scene.rotation.y = (landmarks[0].x - 0.5) * 2;

                    } else {
                        isHandDetected = false;
                        gestureHint.innerText = "No hand detected";
                        // If no hand, drift back to 0 or stay? Let's stay to allow manual override
                    }
                }
            }
            if (webcamRunning) requestAnimationFrame(predictWebcam);
        };

        // Start Vision
        createHandLandmarker();


        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            
            // Update Uniforms
            material.uniforms.uTime.value = time;
            
            // Smoothly update expansion based on global factor
            const currentExp = material.uniforms.uExpansion.value;
            material.uniforms.uExpansion.value += (expansionFactor - currentExp) * 0.1;

            // Idle rotation
            if(!isHandDetected) {
                scene.rotation.y += 0.002;
            } else {
                 // Subtle feedback rotation when interacting
                 scene.rotation.y += 0.005;
            }

            renderer.render(scene, camera);
        }

        animate();

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            material.uniforms.uSize.value = PARTICLE_SIZE * window.innerHeight * 0.5;
        });

    </script>
</body>
</html>
